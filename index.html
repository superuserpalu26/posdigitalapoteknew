<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>Zettbos Web App</title>
  <style>
    /* Reset dasar dan pengaturan tema Zettbos (Dark Mode) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
    }

    /* Container utama untuk iframe full-screen */
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }

    /* Styling iframe agar menyatu penuh tanpa border */
    iframe#gasFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #0b0f19;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    iframe#gasFrame.loaded {
      opacity: 1;
    }

    /* Overlay Preloader bergaya Glassmorphism Zettbos */
    #loaderOverlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, rgba(0, 255, 170, 0.08), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(21, 27, 38, 0.9), #0b0f19);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 20px;
      text-align: center;
    }

    #loaderOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Kartu Glassmorphism di tengah loader */
    .loader-card {
      background: rgba(21, 27, 38, 0.75);
      border: 1px solid rgba(0, 255, 170, 0.2);
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Animasi Spinner Neon Green */
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 255, 170, 0.15);
      border-top-color: #00ffaa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #ffffff;
    }

    .loader-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Tombol Fallback jika koneksi lambat atau iframe terblokir */
    #fallbackBox {
      display: none;
      margin-top: 8px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    #fallbackBox.show {
      display: flex;
    }

    .btn-direct {
      display: inline-block;
      width: 100%;
      padding: 10px 16px;
      background-color: #00ffaa;
      color: #0b0f19;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      border-radius: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-direct:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 255, 170, 0.3);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Layar Loading Awal -->
    <div id="loaderOverlay">
      <div class="loader-card">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loader-title">Memuat Aplikasi...</div>
        <div class="loader-subtitle">Menghubungkan ke server Google Apps Script. Mohon tunggu sebentar.</div>

        <!-- Opsi buka langsung jika loading terlalu lama -->
        <div id="fallbackBox">
          <div class="loader-subtitle">Memuat lebih lama dari biasanya?</div>
          <a
            id="directLink"
            class="btn-direct"
            href="https://script.google.com/macros/s/AKfycbwmrmGrhMq3VD5TiG_BDkCD0lB8Eq7TgYLseH0i2c9Ygtt7jgF4BsMu6XeEjN3ftRFfUg/exec"
            target="_blank"
            rel="noopener noreferrer"
          >
            Buka Langsung di Tab Baru
          </a>
        </div>
      </div>
    </div>

    <!-- Iframe Pembungkus Google Apps Script -->
    <iframe
      id="gasFrame"
      src="https://script.google.com/macros/s/AKfycbwmrmGrhMq3VD5TiG_BDkCD0lB8Eq7TgYLseH0i2c9Ygtt7jgF4BsMu6XeEjN3ftRFfUg/exec"
      title="Google Apps Script Web App"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
      allowfullscreen
    ></iframe>
  </div>

  <script>
    (function () {
      try {
        var iframeEl = document.getElementById('gasFrame');
        var loaderEl = document.getElementById('loaderOverlay');
        var fallbackEl = document.getElementById('fallbackBox');

        // Tampilkan tombol fallback jika iframe belum selesai dimuat dalam 8 detik
        var fallbackTimer = setTimeout(function () {
          if (fallbackEl && loaderEl && !loaderEl.classList.contains('hidden')) {
            fallbackEl.classList.add('show');
          }
        }, 8000);

        // Sembunyikan layar loading saat iframe selesai dimuat
        if (iframeEl) {
          iframeEl.addEventListener('load', function () {
            clearTimeout(fallbackTimer);
            iframeEl.classList.add('loaded');
            if (loaderEl) {
              loaderEl.classList.add('hidden');
            }
          });
        }
      } catch (err) {
        // Fallback aman jika terjadi kendala skrip di browser lama
        var overlay = document.getElementById('loaderOverlay');
        if (overlay) {
          overlay.style.display = 'none';
        }
      }
    })();
  </script>
</body>
</html>
